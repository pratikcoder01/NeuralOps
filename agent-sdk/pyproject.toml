[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralops-agent"
version = "0.1.0"
description = "Lightweight infrastructure metrics agent for NeuralOps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "psutil>=5.9",
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0"
]

[project.scripts]
neuralops-agent = "neuralops_agent.cli:main"

[tool.setuptools]
packages = ["neuralops_agent", "neuralops_agent.transport", "neuralops_agent.utils"]

[tool.pyrefly]
ignore-missing-imports = true
search-path = ["."]
