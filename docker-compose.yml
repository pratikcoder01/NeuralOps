version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: neuralops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuralops}
      POSTGRES_USER: ${POSTGRES_USER:-neuralops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuralops}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuralops} -d ${POSTGRES_DB:-neuralops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: neuralops-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neuralops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: neuralops-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: neuralops-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: neuralops-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "bash", "-c", "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw.metrics --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic anomaly.events --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic remediation.cmds --partitions 1 --replication-factor 1" ]

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5
    container_name: neuralops-neo4j
    ports:
      - "7474:7474" # HTTP Console
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=none # Disable authentication for local development ease
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # MLflow Tracking Server
  mlflow:
    image: python:3.11-slim
    container_name: neuralops-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    entrypoint: >
      bash -c "pip install mlflow && 
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Apache Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: neuralops-airflow-webserver
    ports:
      - "8083:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://neuralops:neuralops@postgres:5432/neuralops
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - airflow_data:/opt/airflow
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Apache Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: neuralops-airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://neuralops:neuralops@postgres:5432/neuralops
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - airflow_data:/opt/airflow
    command: scheduler
    restart: unless-stopped

  # Custom Application Ingestion Service
  ingestion-service:
    build:
      context: ./apps/ingestion-service
      dockerfile: Dockerfile
    container_name: neuralops-ingestion-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://neuralops:neuralops@postgres:5432/neuralops
      - MONGO_URI=mongodb://mongo:27017/neuralops
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REMEDIATION_SERVICE_URL=http://remediation-service:8000/remediate
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Custom Alerting Service
  alerting-service:
    build:
      context: ./apps/alerting-service
      dockerfile: Dockerfile
    container_name: neuralops-alerting-service
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://neuralops:neuralops@postgres:5432/neuralops
      - MONGO_URI=mongodb://mongo:27017/neuralops
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Custom Remediation Service
  remediation-service:
    build:
      context: ./apps/remediation-service
      dockerfile: Dockerfile
    container_name: neuralops-remediation-service
    ports:
      - "8001:8000" # Mapped to host 8001 to prevent conflict with Ingestion Service (8000)
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ML Model Inference Server
  ml-inference:
    build:
      context: .
      dockerfile: ml/anomaly_detection/serving/Dockerfile.inference
    container_name: neuralops-ml-inference
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INFERENCE_API_URL=http://localhost:8080/predict
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      kafka:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # SRE Frontend Web Application
  web-frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: neuralops-web-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://ingestion-service:8000
      - NEXT_PUBLIC_WS_URL=ws://alerting-service:4000/graphql
    depends_on:
      ingestion-service:
        condition: service_healthy
      alerting-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  neo4j_data:
  mlflow_data:
  airflow_data:
