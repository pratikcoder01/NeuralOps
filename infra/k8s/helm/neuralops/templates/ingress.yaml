apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuralops-ingress
  labels:
    app: neuralops
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- if .Values.ingress }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    {{- else }}
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/placeholder-uuid
    {{- end }}
    {{- else }}
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/placeholder-uuid
    {{- end }}
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          - path: /api/v1/ingestion
            pathType: Prefix
            backend:
              service:
                name: ingestion-service
                port:
                  number: 8000
          - path: /api/v1/alerting
            pathType: Prefix
            backend:
              service:
                name: alerting-service
                port:
                  number: 4000
          - path: /api/v1/remediation
            pathType: Prefix
            backend:
              service:
                name: remediation-service
                port:
                  number: 8000
          - path: /api/v1/inference
            pathType: Prefix
            backend:
              service:
                name: ml-inference
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingestion-service
                port:
                  number: 8000
