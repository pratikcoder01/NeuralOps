apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app: neuralops
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion | default "us-east-1" }}
      auth:
        jwt:
          # Service Account role mapping (IRSA) for EKS
          serviceAccountRef:
            name: {{ .Values.serviceAccountName | default "neuralops-sa" }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ingestion-secrets
  labels:
    app: neuralops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: ingestion-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: neuralops/prod/secrets
        property: database-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: neuralops/prod/secrets
        property: jwt-secret
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: neuralops/prod/secrets
        property: slack-webhook-url
    - secretKey: API_KEY
      remoteRef:
        key: neuralops/prod/secrets
        property: api-key
