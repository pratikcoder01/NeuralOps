global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ingestion-service"
    static_configs:
      - targets: ["ingestion-service:8000"]

  - job_name: "alerting-service"
    static_configs:
      - targets: ["alerting-service:4000"]

  - job_name: "remediation-service"
    static_configs:
      - targets: ["remediation-service:8001"]
