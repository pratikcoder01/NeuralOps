name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Gate job: determines if AWS secrets are configured.
  # Job-level `if:` only supports: github, needs, inputs, vars.
  # Secrets must be surfaced via a step output and read via needs.
  # ──────────────────────────────────────────────────────────────
  check-aws:
    name: Check AWS Secrets
    runs-on: ubuntu-latest
    outputs:
      has_aws: ${{ steps.detect.outputs.has_aws }}
    steps:
      - name: Detect AWS secrets
        id: detect
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "has_aws=true" >> $GITHUB_OUTPUT
            echo "AWS credentials detected — Docker image build will be enabled."
          else
            echo "has_aws=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS credentials not configured — Docker image build will be skipped."
          fi

  # ──────────────────────────────────────────────────────────────
  test-python:
    name: Test Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion-service, remediation-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/${{ matrix.service }}/requirements.txt ]; then
            pip install -r apps/${{ matrix.service }}/requirements.txt
          fi
          pip install pytest pytest-cov httpx

      - name: Run pytest with coverage
        run: |
          cd apps/${{ matrix.service }}
          if [ -d tests ]; then
            pytest --cov=. --cov-report=xml --cov-fail-under=80
          else
            echo "No tests directory found for apps/${{ matrix.service }}. Skipping test suite run."
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./apps/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  test-node:
    name: Test Node Alerting Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/alerting-service/package.json

      - name: Install dependencies
        run: |
          cd apps/alerting-service
          npm install

      - name: Run Prisma Generate (if exists)
        run: |
          if [ -d apps/alerting-service/prisma ]; then
            cd apps/alerting-service && npx prisma generate
          fi

      - name: Run Type Check
        run: |
          cd apps/alerting-service
          npx tsc --noEmit

      - name: Run Linter
        run: |
          cd apps/alerting-service
          npm run lint || echo "Linting step completed"

      - name: Run Tests
        run: |
          cd apps/alerting-service
          npm test

  # ──────────────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm install

      - name: Build Next.js
        run: |
          cd apps/web
          npm run build

      - name: Run Playwright E2E Tests (if configured)
        run: |
          cd apps/web
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            npx playwright install --with-deps
            npx playwright test
          else
            echo "No Playwright configuration found. Skipping E2E tests."
          fi

  # ──────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scans (SAST & Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Run Bandit (Python Security Linter)
        run: |
          pip install bandit
          bandit -r apps/
        continue-on-error: true

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'auto'
          generateSarif: '1'
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # Only runs on main branch AND when AWS secrets are configured.
  # Uses `needs.check-aws.outputs.has_aws` via the `needs` context
  # which IS allowed in job-level if: conditions.
  # ──────────────────────────────────────────────────────────────
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [check-aws, test-python, test-node, test-frontend, security-scan]
    if: github.ref == 'refs/heads/main' && needs.check-aws.outputs.has_aws == 'true'
    strategy:
      matrix:
        service: [ingestion-service, alerting-service, remediation-service, ml-inference]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: neuralops/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DOCKERFILE="Dockerfile"
          CONTEXT="apps/${{ matrix.service }}"

          if [ "${{ matrix.service }}" = "ml-inference" ]; then
            DOCKERFILE="ml/anomaly_detection/serving/Dockerfile.inference"
            CONTEXT="."
          elif [ "${{ matrix.service }}" = "remediation-service" ]; then
            CONTEXT="apps/remediation-service"
          elif [ "${{ matrix.service }}" = "alerting-service" ]; then
            CONTEXT="apps/alerting-service"
          fi

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f $DOCKERFILE $CONTEXT
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
