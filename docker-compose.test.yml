version: '3.8'

services:
  postgres-test:
    image: postgres:15
    container_name: neuralops-postgres-test
    environment:
      POSTGRES_DB: neuralops_test
      POSTGRES_USER: neuralops
      POSTGRES_PASSWORD: neuralops
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralops -d neuralops_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo-test:
    image: mongo:7
    container_name: neuralops-mongo-test
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: neuralops-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper-test:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: neuralops-zookeeper-test
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka-test:
    image: confluentinc/cp-kafka:7.4.0
    container_name: neuralops-kafka-test
    depends_on:
      zookeeper-test:
        condition: service_healthy
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,PLAINTEXT_INTERNAL://kafka-test:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka-init-test:
    image: confluentinc/cp-kafka:7.4.0
    container_name: neuralops-kafka-init-test
    depends_on:
      kafka-test:
        condition: service_healthy
    entrypoint: [ "bash", "-c", "kafka-topics --bootstrap-server kafka-test:29092 --create --if-not-exists --topic raw.metrics --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka-test:29092 --create --if-not-exists --topic anomaly.events --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka-test:29092 --create --if-not-exists --topic remediation.cmds --partitions 1 --replication-factor 1" ]
